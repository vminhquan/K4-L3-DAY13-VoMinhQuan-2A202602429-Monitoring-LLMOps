<head>

  <style>
    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --surface-subtle: #111111;
      --surface-border: rgba(255, 255, 255, 0.08);
      --surface-hover: #171717;
      
      --text: #ededed;
      --text-muted: #888888;
      --text-dim: #555555;
      
      --blue: #0070f3;
      --blue-glow: rgba(0, 112, 243, 0.25);
      --emerald: #00e599;
      --emerald-glow: rgba(0, 229, 153, 0.15);
      --amber: #f5a623;
      --red: #ff0055;
      --purple: #7928ca;
      
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient background gradient */
    .glow-header {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 250px;
      background: radial-gradient(ellipse 60% 40% at 50% -20%, rgba(0, 112, 243, 0.18), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      height: 60px;
      border-bottom: 1px solid var(--surface-border);
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .bot-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--blue), var(--emerald));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 12px var(--blue-glow);
    }
    .brand-title {
      font-size: 14px;
      font-weight: 600;
    }
    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 500;
      border: 1px solid var(--surface-border);
      background: var(--surface-subtle);
      color: var(--text-muted);
      text-decoration: none;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }

    /* Main Chat Layout */
    .chat-layout {
      flex: 1;
      display: flex;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      flex-direction: column;
      position: relative;
      z-index: 1;
      height: calc(100vh - 60px);
    }

    /* Messages Scroll Area */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .messages-container::-webkit-scrollbar { width: 6px; }
    .messages-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }

    /* Message Bubbles */
    .msg-row {
      display: flex;
      gap: 14px;
      max-width: 860px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      background: var(--surface-subtle);
      border: 1px solid var(--surface-border);
    }
    .msg-row.bot .msg-avatar {
      background: linear-gradient(135deg, rgba(0, 112, 243, 0.2), rgba(0, 229, 153, 0.2));
      border-color: rgba(0, 112, 243, 0.4);
      color: #00e599;
    }
    .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      padding: 16px 20px;
      font-size: 14px;
      line-height: 1.65;
      color: #dedede;
      position: relative;
    }
    .msg-row.user .msg-bubble {
      background: #0070f3;
      border-color: #0070f3;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-bubble h4 {
      font-size: 15px;
      color: #fff;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Embedded Rich Components */
    .rich-card {
      background: var(--surface-subtle);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-top: 12px;
      font-size: 13px;
    }
    .rich-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .stat-pill {
      background: #000;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
    }
    .stat-pill b {
      display: block;
      font-size: 18px;
      font-family: var(--font-mono);
      color: #fff;
      margin-bottom: 2px;
    }
    .stat-pill span {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Code block */
    .code-snippet {
      background: #000;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 10px;
      color: #00e599;
      white-space: pre-wrap;
    }

    /* Quick Action Chips */
    .quick-chips-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .chip-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--surface-border);
      color: #0091ff;
      border-radius: 9999px;
      padding: 5px 12px;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip-btn:hover {
      background: rgba(0, 112, 243, 0.15);
      border-color: rgba(0, 112, 243, 0.4);
      color: #fff;
    }

    /* Typing Indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* Bottom Input Bar */
    .input-bar {
      padding: 16px 20px 20px;
      background: rgba(0, 0, 0, 0.85);
      border-top: 1px solid var(--surface-border);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }
    .input-box-wrapper {
      display: flex;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      padding: 8px 12px;
      transition: border-color 0.15s;
    }
    .input-box-wrapper:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 1px var(--blue);
    }
    .chat-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #fff;
      font-family: var(--font-sans);
      font-size: 14px;
    }
    .chat-input::placeholder { color: var(--text-dim); }
    .send-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: opacity 0.15s;
    }
    .send-btn:hover { opacity: 0.9; }

    .bottom-hint {
      font-size: 11.5px;
      color: var(--text-dim);
      margin-top: 8px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .bottom-hint a { color: var(--text-muted); text-decoration: none; }
    .bottom-hint a:hover { color: #fff; text-decoration: underline; }
  </style>
</head>

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.innerHTML = sender === 'bot' ? '🤖' : '👤';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = htmlContent;

      if (richCard) {
        bubble.innerHTML += richCard;
      }

      if (chips && chips.length > 0) {
        const chipsContainer = document.createElement('div');
        chipsContainer.className = 'quick-chips-bar';
        chips.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'chip-btn';
          btn.innerText = c.label;
          btn.onclick = () => {
            if (c.url) {
              window.open(c.url, '_blank');
            } else if (c.query) {
              handleQuery(c.query, c.label);
            }
          };
          chipsContainer.appendChild(btn);
        });
        bubble.appendChild(chipsContainer);
      }

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatContainer.appendChild(row);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showTypingIndicator() {
      const row = document.createElement('div');
      row.className = 'msg-row bot';
      row.id = 'typing-indicator-row';
      row.innerHTML = `
        <div class="msg-avatar">🤖</div>
        <div class="msg-bubble" style="padding: 10px 14px;">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      `;
      chatContainer.appendChild(row);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typing-indicator-row');
      if (el) el.remove();
    }

    function handleQuery(key, userLabel = null) {
      if (userLabel) {
        appendMessage('user', userLabel);
      }

      showTypingIndicator();
      setTimeout(() => {
        removeTypingIndicator();
        const res = RESPONSES[key];
        if (res) {
          appendMessage('bot', res.text, res.chips, res.card);
        } else {
          // Fallback dynamic answer
          appendMessage('bot', `Cảm ơn bạn đã hỏi về <b>${userLabel || key}</b>!
Hệ thống Lab Day 13 của học viên Võ Minh Quân kết hợp chặt chẽ giữa <b>FastAPI, Structlog PII Scrubbing, Langfuse Tracing SDK v4</b> và bảng điều khiển giám sát 6 panel. Bạn có thể chọn các chủ đề bên dưới để nghe giải thích cụ thể:`, [
            { label: "🏗️ Xem Kiến trúc 3 Trụ Cột", query: "kien_truc" },
            { label: "🛡️ Xem Lọc PII (100/100)", query: "pii_logging" },
            { label: "🚨 Xem Điều tra sự cố Challenge", query: "incident_rca" },
            { label: "🏆 Xem Điểm số & Pytest", query: "results_grading" }
          ]);
        }
      }, 400);
    }

    function sendUserMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';

      appendMessage('user', text);
      const lower = text.toLowerCase();

      showTypingIndicator();
      setTimeout(() => {
        removeTypingIndicator();
        if (lower.includes('pii') || lower.includes('bảo mật') || lower.includes('cccd') || lower.includes('sđt') || lower.includes('log')) {
          const r = RESPONSES['pii_logging'];
          appendMessage('bot', r.text, r.chips, r.card);
        } else if (lower.includes('sự cố') || lower.includes('challenge') || lower.includes('rag_slow') || lower.includes('rca') || lower.includes('chậm')) {
          const r = RESPONSES['incident_rca'];
          appendMessage('bot', r.text, r.chips, r.card);
        } else if (lower.includes('trace') || lower.includes('langfuse') || lower.includes('waterfall') || lower.includes('prompt')) {
          const r = RESPONSES['tracing_prompt'];
          appendMessage('bot', r.text, r.chips, r.card);
        } else if (lower.includes('dashboard') || lower.includes('slo') || lower.includes('panel') || lower.includes('alert')) {
          const r = RESPONSES['dashboard_slo'];
          appendMessage('bot', r.text, r.chips, r.card);
        } else if (lower.includes('điểm') || lower.includes('kết quả') || lower.includes('pytest') || lower.includes('test') || lower.includes('pass')) {
          const r = RESPONSES['results_grading'];
          appendMessage('bot', r.text, r.chips, r.card);
        } else {
          handleQuery('kien_truc');
        }
      }, 450);
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter') {
        sendUserMessage();
      }
    }

    // Initialize welcome
    window.addEventListener('DOMContentLoaded', () => {
      const initial = RESPONSES['start'];
      appendMessage('bot', initial.text, initial.chips);
    });
  </script>
</body>
</html>
