alerts:
  - name: high_latency_p95
    severity: critical
    condition: "p95(latency_ms) > 3000"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: on-call-team
    runbook: docs/alerts.md#alert-1

  - name: high_error_rate
    severity: critical
    condition: "error_rate_pct > 2"
    duration: 3m
    type: symptom-based
    channel: slack
    owner: on-call-team
    runbook: docs/alerts.md#alert-2

  - name: cost_spike
    severity: warning
    condition: "sum(cost_usd) > 2.5 per hour"
    duration: 10m
    type: symptom-based
    channel: slack
    owner: platform-team
    runbook: docs/alerts.md#alert-3
